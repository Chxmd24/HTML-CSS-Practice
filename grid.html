<!DOCTYPE html>
<html>
  <head>
    <title>Grid Practice</title>
  </head>
  <body>
    <div style="
      display: grid;
      grid-template-columns: 100px 100px;
      ">
      <div style="background-color: lightblue;">div 1</div>
      <div style="background-color: lightpink;">div 2</div>
    </div>

    <div style="
      margin-top: 30px;
      display: grid;
      grid-template-columns: 100px 100px 200px;
      ">
      <div style="background-color: lightblue;">div 1</div>
      <div style="background-color: lightpink;">div 2</div>
      <div style="background-color: lightblue;">div 3</div>
      <div style="background-color: lightpink;">div 4</div>
      <div style="background-color: lightblue;">div 5</div>
    </div>

    <div style="
      margin-top: 30px;
      display: grid;
      grid-template-columns: 100px 1fr 2fr;
      ">
      <div style="background-color: lightblue;">div 1</div>
      <div style="background-color: lightpink;">div 2</div>
      <div style="background-color: lightblue;">div 3</div>      
    </div>

    <div style="
      margin-top: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 20px;
      row-gap: 40px;
      ">
      <div style="background-color: lightblue; height: 150px;">1fr</div>
      <div style="background-color: lightpink; height: 150px;">1fr</div>
      <div style="background-color: lightblue; height: 150px;">1fr</div> 
      <div style="background-color: lightpink; height: 150px;">1fr</div>
      <div style="background-color: lightblue; height: 150px;">1fr</div> 
      <div style="background-color: lightpink; height: 150px;">1fr</div>
    </div>
  </body>
  </html>
