<!DOCTYPE html>
<html>
  <head>
    <title>Position practice</title>
  </head>
  <body style="padding-bottom: 900px;">
    <div style="
      position: fixed;
      background-color: black;
      color: white;
      z-index: 2;
    ">Header</div>

    <div style="
      background-color: green;
      color: white;
      position: fixed;
      bottom: 0;
      left: 0;
      top: 50px;
      width: 72px;
    ">
      Sidebar
    </div>

    <div style="
      position: absolute;
      color: white;
      background-color: red;
      z-index: 1;
    ">
      absolute
    </div>

    <div style="
      background-color: lightblue; 
      height: 200px; 
      width: 200px;
    ">div 1</div>

    <div style="
      background-color: lightpink; 
      height: 200px; 
      width: 200px;
      position: relative;
    ">div 2</div>
  </body>
</html>
